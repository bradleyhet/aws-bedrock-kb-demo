[project]
name = "kb-demo"
version = "0.1.0"
description = "Search-and-answer demo on Amazon Bedrock Managed Knowledge Base, over a fictional handbook"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.120",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
