# Every push to master and every pull request into it: ruff, pytest and gitleaks, and for the .NET
# API dotnet format, its tests, the container image and a Trivy scan of it. A v* tag also runs the
# evaluation gate against the live knowledge base and, only if it passes, deploys the kb-demo
# stack. AWS access is by OIDC into the roles the kb-demo-ci stack makes, which trust this repo's
# v* tags only, so pull requests get none; GitHub holds no AWS keys. The account ID comes from the AWS_ACCOUNT repo secret rather than a variable, so logs
# mask it. This file was ci.yml until 1 November 2026, when GitHub's record of that workflow stuck.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  KB_DEMO_PROFILE: ""  # no named profile: credentials come from OIDC through the environment
  AWS_REGION: ap-southeast-2

jobs:
  checks:
    name: ruff, pytest, gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner

  dotnet:
    name: dotnet format, tests, image, trivy
    # arm64, like the Lambda the image will run on, so the image is built and started natively.
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: dotnet/global.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: docker build --platform linux/arm64 --tag kb-demo-dotnet:ci .
      - name: smoke test (the image runs as a non-root user and answers /healthz)
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' kb-demo-dotnet:ci)
          echo "image user: $user"
          [ -n "$user" ] && [ "$user" != "0" ] && [ "$user" != "root" ]
          # Start-up validation needs settings; /healthz itself never calls AWS.
          container=$(docker run --detach --publish 8080:8080 \
            --env KB_DEMO_KNOWLEDGE_BASE_ID=SMOKETEST --env KB_DEMO_MODEL_ID=smoke-test \
            kb-demo-dotnet:ci)
          # Until the app listens, Docker's port proxy resets the connection rather than refusing
          # it, so retry every error, not only refusals.
          curl --silent --show-error --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://localhost:8080/healthz || { docker logs "$container"; exit 1; }
      - name: trivy
        env:
          VERSION: 0.76.1
        # Fails on HIGH or CRITICAL findings that have a fix; an unfixed one can't be acted on here.
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v$VERSION"
          archive="trivy_${VERSION}_Linux-ARM64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/trivy_${VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" trivy
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            kb-demo-dotnet:ci

  evaluate:
    name: evaluation gate
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/kb-demo-ci-evaluate
          aws-region: ${{ env.AWS_REGION }}
      # This commit's own Searcher and prompt, against the live knowledge base.
      - run: uv run kb-demo eval

  deploy:
    name: cdk deploy
    needs: evaluate
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/kb-demo-ci-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: npx --yes aws-cdk@2.1146.1 deploy kb-demo --require-approval never
